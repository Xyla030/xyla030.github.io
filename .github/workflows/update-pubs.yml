name: Update publications
on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 update_pubs.py
      - name: Commit if changed
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain pubs_cache.json)" ]; then echo "no changes"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html pubs_cache.json
          git commit -m "Update publications"
          git push
